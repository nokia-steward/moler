name: Python CI

on: [push]

jobs:
  test:
    timeout-minutes: 50
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        exclude:
        - os: macos-latest
          python-version: "3.10"
      fail-fast: false
    env:
      MOLER_DEBUG_THREADS: True
      PYTHON_COVERAGE: '3.15'
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.os }} ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -Ur requirements/test.txt
      - name:  Create local users required by integration tests
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        run: |
          retry() {
            local max_attempts=5
            local delay=10
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "---- '$*' failed after $attempt attempts"
                return 1
              fi
              echo "---- '$*' failed (attempt $attempt/$max_attempts), retrying in ${delay}s"
              attempt=$((attempt + 1))
              sleep "$delay"
            done
          }
          create_user() {
            local name=$1 comment=$2 password=$3
            id -u "$name" >/dev/null 2>&1 || sudo useradd "$name" -c "$comment" -s /bin/bash -l -m
            echo "$name:$password" | sudo chpasswd
          }
          retry sh -c 'sudo apt-get update && sudo apt-get -y install sshpass'
          cat /etc/passwd | grep home
          retry create_user molerssh MolerSshTest moler_password
          retry create_user sshproxy Proxy4SshTest proxy_password
          retry create_user adbshell AdbShell4SshTest adb_password
          cat /etc/passwd | grep home
          echo ---- try logging as integration tests users via ssh
          retry sshpass -p moler_password ssh -oStrictHostKeyChecking=no molerssh@localhost pwd
          retry sshpass -p proxy_password ssh -oStrictHostKeyChecking=no sshproxy@localhost pwd
          retry sshpass -p adb_password ssh -oStrictHostKeyChecking=no adbshell@localhost pwd
      - name:  Upload adb simulator
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo cp adb_simulation.sh /usr/bin/adb
          sudo chmod +x /usr/bin/adb
          sudo ls -l /usr/bin/adb
          which adb
          echo ----------- test adb simulator
          adb devices
      - name: Test with pytest
        if: ${{ (matrix.python-version != env.PYTHON_COVERAGE) || (matrix.os == 'macos-latest') }}
        timeout-minutes: 30
        run: |
          python -m pytest -vvvsss test/
      - name: Test with pytest and coverage
        if: ${{ (matrix.python-version == env.PYTHON_COVERAGE) && (matrix.os == 'ubuntu-latest') }}
        timeout-minutes: 49
        run: |
          pip list
          python --version
          coverage --version
          coverage run -m pytest -vvvsss test/
          ls -l .coverage
      - name: Validate moler overall coverage
        if: ${{ (matrix.python-version == env.PYTHON_COVERAGE) && (matrix.os == 'ubuntu-latest') }}
        run: |
          coverage report -m --fail-under=91
      - name: Validate coverage for moler commands
        if: ${{ (matrix.python-version == env.PYTHON_COVERAGE) && (matrix.os == 'ubuntu-latest') }}
        run: |
          coverage report -m --fail-under=100 --include="moler/cmd/**/*.py"
      - name: Validate coverage for moler events
        if: ${{ (matrix.python-version == env.PYTHON_COVERAGE) && (matrix.os == 'ubuntu-latest') }}
        run: |
          coverage report -m --fail-under=100 --include="moler/events/**/*.py"
      - name: Upload pytest test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            moler*.log
            .coverage
          retention-days: 5

  style:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.os }} ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -Ur requirements/test.txt
      - name: Check PyCodeStyle
        run: |
          pycodestyle --statistics --count moler
#      - name: Check PyDocStyle
#        run: |
#          pydocstyle --count moler
      - name: Check PyLint
        run: |
          pylint moler --fail-under=8.4 --rcfile=./pylint.cfg || (exit $(($? % 4)))
      - name: Check flake8
        run: |
          flake8 moler --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 moler --count --exit-zero --max-complexity=10 --max-line-length=160 --statistics
